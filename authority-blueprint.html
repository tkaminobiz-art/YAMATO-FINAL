<!DOCTYPE html>
<html lang="ja" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やまと｜実績セクション（設計図モチーフ）</title>
<link rel="stylesheet" href="https://use.typekit.net/aym8vre.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EA; --paper2:#EFE9DD; --ink:#241F1B; --ink2:#5A544C; --line:#D8D1C4;
    --green:#486B00; --green-d:#2E4600; --lime:#7E9A2E; --gold:#B98B34;
    --fh:"dnp-shuei-gothic-gin-std","Noto Sans JP",sans-serif;
    --fn:"Inter","Noto Sans JP",sans-serif; --fb:"Noto Sans JP",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--fb);line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"palt"}
  .pad{height:56vh;background:#12160c;display:flex;align-items:center;justify-content:center;color:#5c6349;font-family:var(--fn);letter-spacing:.2em;font-size:12px}
  .pad.light{background:var(--paper2);color:var(--ink2)}

  .authority{position:relative;overflow:hidden;isolation:isolate;background:var(--paper);
    padding:clamp(72px,10vw,150px) 0 clamp(56px,7vw,100px)}
  /* 方眼グリッド（設計用紙） */
  .authority__grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 100% at 70% 45%,#000 30%,transparent 80%);mask-image:radial-gradient(120% 100% at 70% 45%,#000 30%,transparent 80%)}
  .wrap{position:relative;z-index:2;max-width:1220px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
  .row{display:grid;grid-template-columns:1fr 1.08fr;gap:clamp(28px,4vw,64px);align-items:center}

  /* 左：実績テキスト */
  .eyebrow{font-family:var(--fn);font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--green);
    display:inline-flex;align-items:center;gap:14px;margin-bottom:clamp(18px,2.6vw,30px)}
  .eyebrow::before{content:"";width:34px;height:1px;background:currentColor;opacity:.55}
  .bignum{display:flex;align-items:baseline;gap:.05em;line-height:.84}
  .count{font-family:var(--fn);font-weight:800;font-size:clamp(6rem,15vw,12.5rem);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
  .unit{font-family:var(--fh);font-weight:700;font-size:clamp(1.7rem,4vw,3.1rem);color:var(--green);transform:translateY(-.12em)}
  /* 数字を寸法線で注記 */
  .dimnum{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--gold)}
  .dimnum .bar{position:relative;height:1px;background:currentColor;flex:1;max-width:210px}
  .dimnum .bar::before,.dimnum .bar::after{content:"";position:absolute;top:-4px;width:1px;height:9px;background:currentColor}
  .dimnum .bar::before{left:0}.dimnum .bar::after{right:0}
  .dimnum span{font-family:var(--fn);font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  .lead{font-family:var(--fh);font-weight:700;font-size:clamp(1.45rem,2.4vw,2.15rem);letter-spacing:.03em;color:var(--ink);line-height:1.5;margin-top:clamp(22px,3vw,34px);text-wrap:balance}
  .sub{font-family:var(--fb);font-size:clamp(.95rem,1.2vw,1.05rem);color:var(--ink2);margin-top:14px}
  .stats{display:flex;gap:0;margin-top:clamp(26px,3.4vw,40px);flex-wrap:wrap}
  .stat{padding:4px clamp(16px,2.4vw,34px);position:relative}
  .stat:first-child{padding-left:0}
  .stat + .stat::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:36px;background:var(--line)}
  .stat .n{font-family:var(--fn);font-weight:700;font-size:clamp(1.4rem,2.2vw,1.9rem);color:var(--green);font-variant-numeric:tabular-nums;display:block}
  .stat .l{font-family:var(--fb);font-size:11px;color:var(--ink2);letter-spacing:.03em;margin-top:4px;display:block}

  /* 右：立面図（自分で描かれる） */
  .bp{width:100%;height:auto;display:block;overflow:visible}
  .bp .draw{fill:none;stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke;
    stroke-dasharray:2400;stroke-dashoffset:2400;transition:stroke-dashoffset 2s var(--ease)}
  .bp .thin{stroke-width:1}
  .bp .dim{stroke:var(--gold);stroke-width:1}
  .authority.is-in .bp .draw{stroke-dashoffset:0}
  .authority.is-in .bp .draw.d1{transition-delay:.15s}
  .authority.is-in .bp .draw.d2{transition-delay:.5s}
  .authority.is-in .bp .draw.d3{transition-delay:.9s}
  .bp text{fill:var(--gold);font-family:var(--fn);font-size:14px;letter-spacing:.08em;opacity:0;transition:opacity .8s ease 1.1s}
  .bp .lbl{fill:var(--ink2);font-size:13px;letter-spacing:.22em}
  .authority.is-in .bp text{opacity:.9}

  /* 流れるバナー */
  .marquee{position:relative;z-index:2;margin-top:clamp(52px,6vw,88px);width:100%;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .track{display:flex;gap:22px;width:max-content;padding:8px clamp(11px,1.5vw,22px);animation:flow 46s linear infinite}
  .marquee:hover .track{animation-play-state:paused}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tile{position:relative;flex:0 0 auto;width:clamp(230px,22vw,300px);aspect-ratio:4/5;border-radius:6px;overflow:hidden;text-decoration:none;color:#fff;box-shadow:0 14px 36px rgba(36,31,27,.16);display:block;isolation:isolate}
  .tile__img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);transition:transform .9s var(--ease)}
  .tile::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(20,17,13,.82),rgba(20,17,13,.24) 44%,rgba(20,17,13,.04) 72%)}
  .tile:hover .tile__img{transform:scale(1.09)}
  .tile__body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 18px 20px;text-align:left}
  .tile__en{font-family:var(--fn);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,241,234,.82)}
  .tile__jp{font-family:var(--fh);font-weight:700;font-size:clamp(1.1rem,1.5vw,1.32rem);letter-spacing:.03em;margin-top:5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tile__jp svg{width:18px;height:18px;flex:0 0 auto;transition:transform .5s var(--ease)}
  .tile:hover .tile__jp svg{transform:translateX(5px)}

  [data-reveal]{opacity:0;transform:translateY(30px);filter:blur(6px);transition:opacity .9s var(--ease),transform 1s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}
  .authority.is-in [data-reveal]{opacity:1;transform:none;filter:none}

  @media(max-width:860px){
    .row{grid-template-columns:1fr;gap:8px}
    .bp{max-width:520px;margin:8px auto 0}
    .authority__grid{-webkit-mask-image:radial-gradient(140% 90% at 50% 30%,#000 40%,transparent 85%);mask-image:radial-gradient(140% 90% at 50% 30%,#000 40%,transparent 85%)}
  }
  @media(prefers-reduced-motion:reduce){
    [data-reveal]{opacity:1!important;transform:none!important;filter:none!important;transition:none}
    .bp .draw{stroke-dashoffset:0!important;transition:none}
    .bp text{opacity:.9!important;transition:none}
    .track{animation:none}
  }
</style>
</head>
<body>
<div class="pad">↑ FV（家の動画）から続く想定</div>

<section class="authority" id="auth">
  <div class="authority__grid"></div>
  <div class="wrap">
    <div class="row">
      <!-- 左：実績 -->
      <div class="col-text">
        <p class="eyebrow" data-reveal style="--d:.05s">Track Record ／ 創業からの実績</p>
        <div class="bignum" data-reveal style="--d:.14s"><span class="count" id="count" data-target="600">0</span><span class="unit">棟超</span></div>
        <div class="dimnum" data-reveal style="--d:.24s"><span class="bar"></span><span>600 houses built</span></div>
        <h2 class="lead" data-reveal style="--d:.34s">選ばれるのは、価格だけではありません。</h2>
        <p class="sub" data-reveal style="--d:.42s">創業から、奈良でこれだけの家をつくってきました。その一棟ずつに、設計があります。</p>
        <div class="stats" data-reveal style="--d:.5s">
          <div class="stat"><span class="n">約150</span><span class="l">区画｜自社分譲（常時）</span></div>
          <div class="stat"><span class="n">50</span><span class="l">組｜お客様の声</span></div>
          <div class="stat"><span class="n">◯</span><span class="l">年｜創業</span></div>
        </div>
      </div>

      <!-- 右：立面図（stroke draw） -->
      <div class="col-bp">
        <svg class="bp" viewBox="0 0 660 560" role="img" aria-label="住宅の立面図">
          <!-- 寸法線（上・幅） -->
          <line class="draw dim d1" x1="150" y1="96" x2="510" y2="96"/>
          <line class="draw dim d1" x1="150" y1="86" x2="150" y2="106"/>
          <line class="draw dim d1" x1="510" y1="86" x2="510" y2="106"/>
          <text x="330" y="82" text-anchor="middle">9,100</text>
          <!-- 寸法線（右・高さ） -->
          <line class="draw dim d1" x1="566" y1="150" x2="566" y2="500"/>
          <line class="draw dim d1" x1="556" y1="150" x2="576" y2="150"/>
          <line class="draw dim d1" x1="556" y1="500" x2="576" y2="500"/>
          <text x="588" y="330" text-anchor="middle" transform="rotate(90 588 330)">6,820</text>
          <!-- 外形（壁＋切妻屋根） -->
          <polyline class="draw d1" points="150,150 150,500 510,500 510,150"/>
          <polyline class="draw d1" points="120,158 330,60 540,158"/>
          <line class="draw d1" x1="150" y1="150" x2="510" y2="150"/>
          <!-- 軒の出 -->
          <line class="draw thin d2" x1="120" y1="158" x2="150" y2="150"/>
          <line class="draw thin d2" x1="510" y1="150" x2="540" y2="158"/>
          <!-- 2F 窓 -->
          <rect class="draw d2" x="196" y="196" width="96" height="120"/>
          <line class="draw thin d2" x1="244" y1="196" x2="244" y2="316"/>
          <line class="draw thin d2" x1="196" y1="256" x2="292" y2="256"/>
          <rect class="draw d2" x="366" y="196" width="96" height="120"/>
          <line class="draw thin d2" x1="414" y1="196" x2="414" y2="316"/>
          <line class="draw thin d2" x1="366" y1="256" x2="462" y2="256"/>
          <!-- バルコニー手すり -->
          <line class="draw d2" x1="176" y1="360" x2="484" y2="360"/>
          <line class="draw thin d2" x1="176" y1="380" x2="484" y2="380"/>
          <line class="draw thin d3" x1="210" y1="360" x2="210" y2="380"/>
          <line class="draw thin d3" x1="250" y1="360" x2="250" y2="380"/>
          <line class="draw thin d3" x1="290" y1="360" x2="290" y2="380"/>
          <line class="draw thin d3" x1="330" y1="360" x2="330" y2="380"/>
          <line class="draw thin d3" x1="370" y1="360" x2="370" y2="380"/>
          <line class="draw thin d3" x1="410" y1="360" x2="410" y2="380"/>
          <line class="draw thin d3" x1="450" y1="360" x2="450" y2="380"/>
          <!-- 1F 玄関＋窓 -->
          <rect class="draw d3" x="300" y="404" width="86" height="96"/>
          <line class="draw thin d3" x1="343" y1="404" x2="343" y2="500"/>
          <rect class="draw d3" x="196" y="416" width="80" height="84"/>
          <line class="draw thin d3" x1="236" y1="416" x2="236" y2="500"/>
          <!-- 地盤線 -->
          <line class="draw d1" x1="70" y1="500" x2="600" y2="500"/>
          <line class="draw thin d3" x1="70" y1="508" x2="600" y2="516"/>
          <!-- 方位・スケール注記 -->
          <text class="lbl" x="120" y="546">立面図　ELEVATION　S=1/100</text>
        </svg>
      </div>
    </div>

    <!-- 流れるバナー -->
    <div class="marquee" data-reveal style="--d:.6s" aria-label="関連ページ">
      <div class="track" id="track">
        <a class="tile" href="#"><span class="tile__img" style="background-image:url(assets/authority/voice.webp)"></span><span class="tile__body"><span class="tile__en">Voice</span><span class="tile__jp">お客様の声<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></a>
        <a class="tile" href="#"><span class="tile__img" style="background-image:url(assets/authority/land.webp)"></span><span class="tile__body"><span class="tile__en">Land</span><span class="tile__jp">土地・分譲地<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></a>
        <a class="tile" href="#"><span class="tile__img" style="background-image:url(assets/authority/equipment.webp)"></span><span class="tile__body"><span class="tile__en">Equipment</span><span class="tile__jp">標準装備<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></a>
        <a class="tile" href="#"><span class="tile__img" style="background-image:url(assets/authority/works.webp)"></span><span class="tile__body"><span class="tile__en">Works</span><span class="tile__jp">施工事例<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></a>
        <a class="tile" href="#"><span class="tile__img" style="background-image:url(assets/authority/model.webp)"></span><span class="tile__body"><span class="tile__en">Model House</span><span class="tile__jp">モデルハウス<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></a>
      </div>
    </div>
  </div>
</section>

<div class="pad light">↓ §3 価格（生成り）へ続く想定</div>

<script>
(function(){
  var root=document.documentElement; root.className=root.className.replace('no-js','').trim();
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var sec=document.getElementById('auth'), count=document.getElementById('count'), track=document.getElementById('track');
  if(track){ track.innerHTML += track.innerHTML; }
  function runCount(){ var t=+count.getAttribute('data-target');
    if(reduce){ count.textContent=t; return; }
    var dur=1900,s=null; function tick(n){ if(!s)s=n; var p=Math.min((n-s)/dur,1);
      count.textContent=Math.round((1-Math.pow(1-p,3))*t); if(p<1)requestAnimationFrame(tick);} requestAnimationFrame(tick); }
  var fired=false;
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting&&!fired){ fired=true; sec.classList.add('is-in'); runCount(); } }); },{threshold:.2}).observe(sec);
  } else { sec.classList.add('is-in'); runCount(); }
})();
</script>
</body>
</html>
