<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>実績セクション図面（auth_mock）｜やまと不動産</title>
<!--
  ============================================================
  実績セクション 図面 v2「三帯の明度リズム」 2026-08-19
  ------------------------------------------------------------
  根拠（実測スカウト3本＋ピアセッションの検証）:
   - 明度は帯ごとに極へ振り切る。1つの視野で混ぜない
     （安藤七宝店 0.98→0.27→1.00 / Toll Brothers 暗部97.2%）
     垂直分割は25/67の中間帯に落ち成立例0件のため不採用
   - 770は紅バンドの上端をまたぐ。同座標に2枚置き、
     バンド側を overflow:hidden で切る
     ※mix-blend-mode:difference は紅#BD1B21 上で #42E4DE のシアンになり不可
   - サイズ段階は3（280/48/15）。索引だけ自前の階層を持つ別レジスタ
   - ラテン数字は w200・字間 -0.03em・行間 0.86／和文は +.06em
   - 暗部は写真でなく単色。写真は帯の外（帯内に入れると72.4%止まり）
   - 索引は安藤型の番号付き行 284:720:130 ＝ 24:62:11
   - ティッカーは不採用（手で更新し続けないと嘘になる表示は作らない）
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Shippori+Mincho+B1:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanmp.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2A2620;font-family:"Zen Kaku Gothic New",sans-serif}
  img{display:block;max-width:100%}

  /* ============ 実績（Track Record） ============ */
  .tr{
    --paper:#F4F1EA; --sumi:#241E16; --sumi2:#5C5346; --sumi3:#8A8070; --sumi4:#6E655A;
    --shu:#BD1B21; --foil1:#F1D57D; --foil2:#B08A3C; --cream:#F3EEE3;
    --gx:clamp(20px, 12.36vw, 178px);
    --num:clamp(104px, 66px + 14.9vw, 280px);
    --mid:clamp(25px, 16px + 2.2vw, 48px);
    --sub:15px;
    position:relative;background:url("assets/std/page_kinari.webp") center/cover var(--paper);color:var(--sumi);
    font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.9;isolation:isolate}

  .tr__top{display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,29.9vw,430px);
    gap:clamp(24px,4vw,60px);align-items:start;
    padding:clamp(56px,6.4vw,92px) var(--gx) 0}
  .tr__eye{font-size:var(--sub);letter-spacing:.3em;color:var(--foil2);margin-bottom:24px}
  .tr__h{font-family:"YakuHanMP","Shippori Mincho B1",serif;font-weight:500;
    font-size:var(--mid);letter-spacing:.06em;line-height:1.8;color:var(--sumi)}
  .tr__rule{width:62px;height:1px;border:0;margin:30px 0;
    background:linear-gradient(90deg,var(--foil1),var(--foil2))}
  .tr__lead{font-family:"YakuHanMP","Shippori Mincho B1",serif;font-weight:400;
    font-size:var(--sub);letter-spacing:.06em;line-height:1.9;color:var(--sumi2)}
  .tr__ph{margin:0}
  .tr__ph img{width:100%;aspect-ratio:430/336;object-fit:cover;object-position:50% 56%;
    box-shadow:0 40px 80px -30px rgba(30,14,6,.6)}
  .tr__cap{margin-top:14px;font-size:var(--sub);letter-spacing:.06em;color:var(--sumi3)}

  /* またぎの数字（同座標2枚。バンド側は overflow で切る） */
  .tr__num{display:flex;align-items:baseline;gap:clamp(8px,1.25vw,18px);white-space:nowrap;
    font-size:var(--num);line-height:.86}   /* ← em の基準をここに置く（またぎの要） */
  .tr__num b{font-family:"Inter",sans-serif;font-weight:200;font-size:1em;
    line-height:.86;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    display:inline-block}  /* 幅の予約は script 側で実測して行う（ch は letter-spacing を含まないため） */
  .tr__num i{font-family:"YakuHanMP","Shippori Mincho B1",serif;font-style:normal;font-weight:500;
    font-size:var(--mid);line-height:.86;letter-spacing:.06em}
  .tr__num--sumi{margin:clamp(40px,5vw,72px) 0 -.503em var(--gx);color:var(--sumi)}
  .tr__num--sumi i{color:var(--sumi)}
  .tr__num--foil{position:absolute;left:var(--gx);top:-.357em;color:var(--foil1)}
  .tr__num--foil i{color:var(--cream)}

  /* 紅バンド（暗部支配・単色。写真は入れない） */
  .tr__band{position:relative;overflow:hidden;
    background:url("assets/std/page_beni.webp") center/cover var(--shu);
    padding:clamp(150px,17vw,240px) var(--gx) clamp(40px,5vw,72px)}
  .tr__sw{position:absolute;right:clamp(16px,7vw,150px);top:clamp(60px,8vw,96px);
    width:clamp(96px,14.6vw,210px);opacity:.95;pointer-events:none}
  .tr__note{display:inline-block;font-size:var(--sub);letter-spacing:.04em;
    color:rgba(243,238,227,.72);border:1px solid rgba(241,213,125,.5);
    border-radius:2px;padding:5px 11px}
  .tr__stats{display:flex;flex-wrap:wrap;margin-top:clamp(38px,5.4vw,78px)}
  .tr__stat{display:flex;flex-direction:column;gap:8px;padding:0 clamp(18px,2.8vw,40px)}
  .tr__stat:first-child{padding-left:0}
  .tr__stat + .tr__stat{border-left:1px solid rgba(241,213,125,.42)}
  .tr__sv{display:flex;align-items:baseline;gap:8px}
  .tr__sv b{font-family:"Inter",sans-serif;font-weight:300;font-size:var(--mid);
    line-height:.86;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--cream)}
  .tr__sv i{font-family:"YakuHanMP","Shippori Mincho B1",serif;font-style:normal;
    font-weight:500;font-size:var(--sub);letter-spacing:.08em;color:var(--cream)}
  .tr__sl{font-size:var(--sub);color:rgba(243,238,227,.66)}

  @media (max-width:760px){
    .tr__top{grid-template-columns:1fr}
    .tr__ph{order:-1}
    .tr__stats{gap:22px 0}
    .tr__stat{flex-basis:100%;padding:0}
    .tr__stat + .tr__stat{border-left:0;border-top:1px solid rgba(241,213,125,.28);padding-top:22px}
  }
</style>
</head>
<body>

<section class="tr" id="auth" aria-labelledby="trH">
  <div class="tr__top">
    <div>
      <p class="tr__eye">Track Record</p>
      <h2 class="tr__h" id="trH">選ばれる理由は、<br>価格だけではありません。</h2>
      <hr class="tr__rule">
      <p class="tr__lead">創業から、奈良でこれだけの家をつくってきました。<br>設計も施工も、外注せず自社で手がけています。</p>
    </div>
    <figure class="tr__ph">
      <img src="assets/std/auth_ext_1920.webp"
           srcset="assets/std/auth_ext_1100.webp 1100w, assets/std/auth_ext_1920.webp 1920w, assets/std/auth_ext_2560.webp 2560w"
           sizes="(max-width:760px) 100vw, 32vw" alt="奈良市の実邸 外観" decoding="async">
      <figcaption class="tr__cap">奈良市・実邸　外観</figcaption>
    </figure>
  </div>

  <p class="tr__num tr__num--sumi" aria-hidden="true"><b data-count="770">770</b><i>棟超</i></p>

  <div class="tr__band">
    <p class="tr__num tr__num--foil"><b data-count="770">770</b><i>棟超</i></p>
    <img class="tr__sw" src="assets/std/auth_swallow_foil.png" alt="" aria-hidden="true">
    <p><span class="tr__note">※2026年7月10日現在</span></p>
    <div class="tr__stats">
      <div class="tr__stat">
        <span class="tr__sv"><b>150</b><i>区画以上</i></span>
        <span class="tr__sl">自社分譲（保有）</span>
      </div>
      <div class="tr__stat">
        <span class="tr__sv"><b>50</b><i>組</i></span>
        <span class="tr__sl">お客様の声</span>
      </div>
      <div class="tr__stat">
        <span class="tr__sv"><b id="trY">15</b><i>年目</i></span>
        <span class="tr__sl">創業</span>
      </div>
    </div>
  </div>

</section>

<script>
/* 創業2011-11-30起算。周年で自動繰上げ＝手で更新しなくても風化しない */
(function(){var e=document.getElementById('trY');if(!e)return;
  var n=new Date(),full=n.getFullYear()-2011-((n.getMonth()<10||(n.getMonth()===10&&n.getDate()<30))?1:0),y=full+1;
  if(y>0&&String(y)!==e.textContent)e.textContent=y;})();

/* 770のカウントアップ。墨と箔の2枚は同じ数字なので1本のrAFで同期させる。
   到達時に1回だけ。reduced-motion では即座に確定値を出す。 */
(function(){
  var els=[].slice.call(document.querySelectorAll('[data-count]'));
  if(!els.length) return;
  /* Webフォント読込前に測るとフォールバック書体の幅（実測+9.4px）を予約してしまい、
     着地時に縮んで跳ねる。fonts.ready を待ってから初期化する */
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); } else { init(); }
  function init(){
  var target=parseInt(els[0].getAttribute('data-count'),10)||0;
  var done=false;
  function paint(v){ var t=String(v); for(var i=0;i<els.length;i++) els[i].textContent=t; }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ paint(target); return; }
  /* 確定値を出したままの実幅を予約してから0に戻す。
     ch は letter-spacing を含まず実測で 3ch < 実幅 だったため、着地時に跳ねる */
  for(var k=0;k<els.length;k++) els[k].style.minWidth=els[k].getBoundingClientRect().width+'px';
  paint(0);
  function run(){
    if(done) return; done=true;
    var dur=1600, t0=performance.now();
    (function step(now){
      var p=Math.min(1,(now-t0)/dur);
      var e=1-Math.pow(1-p,4);            /* power4.out ＝ 終盤で静かに着地 */
      paint(Math.round(target*e));
      if(p<1) requestAnimationFrame(step);
      else { paint(target); for(var k=0;k<els.length;k++) els[k].style.minWidth=''; }  /* 予約を解除＝以後のリサイズに追従 */
    })(t0);
  }
  if(!('IntersectionObserver' in window)){ run(); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(x){ if(x.isIntersecting){ run(); io.disconnect(); } });
  },{threshold:.35});
  io.observe(document.querySelector('.tr__num--sumi')||els[0]);
  }
})();
</script>
</body>
</html>
