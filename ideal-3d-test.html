<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>理想ハウス 高精細メッシュ 品質確認</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js" integrity="sha384-Ftcjj/GNLxPvzNDftO/oryXB9aGxsGZY9JGqsXG0uUKgQDl9RfDgsx9NJ/4IVNPe" crossorigin="anonymous"></script>
<style>
  body{margin:0;background:radial-gradient(120% 90% at 50% 22%,#FBFAF5,#F0ECE2 55%,#E5E0D4 100%);font-family:"Inter",sans-serif}
  model-viewer{width:100vw;height:100vh;--poster-color:transparent}
  .tag{position:fixed;top:16px;left:16px;z-index:10;background:rgba(20,24,14,.72);color:#fff;font-size:12px;letter-spacing:.12em;padding:6px 12px;border-radius:100px}
</style>
</head>
<body>
  <div class="tag">理想ハウス HQメッシュ / tone-mapping + shadow</div>
  <model-viewer id="mv"
    src="assets/ideal-house-hq.glb"
    alt="理想ハウス3D"
    camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="26deg"
    tone-mapping="commerce"
    shadow-intensity="1.3" shadow-softness="0.9"
    exposure="1.1"
    camera-orbit="-38deg 76deg auto" field-of-view="30deg"
    interaction-prompt="none">
  </model-viewer>
</body>
</html>
