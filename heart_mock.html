<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>信条セクション図面（heart_mock）｜やまと不動産</title>
<!--
  ============================================================
  信条（Our philosophy）図面「紅の頁・写真なし」 2026-08-19
  仕様の正本は design_heart_spec.md（数値の出所つき）
  ------------------------------------------------------------
   - 写真ゼロ。文章は「人」の話なのに写真は「部屋」の話でレジスタが合わない
   - 余白は比率で設計: 章の 上:本文:下 = 29:43:28（群言堂 260:384:256）
     隣接章は margin collapse に任せて相殺する（積むと章間に空洞ができる）
   - 地は専用アセット page_beni_dark_*.webp。CSSフィルタでの後付け減光は廃止
     （brightness で沈めると繊維が潰れる。素の page_beni は最大輝度0.9956＝
      金の粒が本文より明るくコントラスト0.87。左上0.1425↔右下0.0528の傾斜もあった）
     専用アセットは Lmax≤0.0508 / 最明最暗比≤2.0 / 対#F3EEE3 で 9.00 以上を実測で保証
   - 地に金は入れない。床7.83を満たす最明の金は #4E3D16（9.06）で、
     紅の上では金でなく黴のシミに見える。箔は柱の罫（文字が載らない位置）だけ
   - 本文は実色 #F3EEE3。透明度を使うと床を割る
   - 段落は全て2行（PC）。1行14〜29字。改行は句・読点で固定しPC/SPを別々に打つ
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400&family=Zen+Kaku+Gothic+New:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yakuhanjp@4.1.1/dist/css/yakuhanmp.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2A2620;font-family:"Zen Kaku Gothic New",sans-serif}

  /* ============ 信条（紅の頁・写真なし） ============ */
  .cr{
    --cream:#F3EEE3; --foil1:#F1D57D;
    --gx:clamp(20px, 5.3vw, 76px);      /* 版面の左右（群言堂 5.27vw） */
    --ng:clamp(40px, 3.9vw, 56px);      /* 柱（一二三）が入る内側の余白 */
    --col:760px;                        /* 段幅。最長29字≒629pxに対し余裕がある */
    --fs:clamp(16px, 14.51px + 0.381vw, 20px);   /* 本文 SP16 → PC20 */
    --fl:clamp(20px, 17.03px + 0.762vw, 28px);   /* 導入 SP20 → PC28 */
    --fm:"YakuHanMP","Shippori Mincho B1",serif;
    /* 章高 = 本文高 ÷ 0.43。上 = 本文高 ×29/43、下 = 本文高 ×28/43 */
    --up:0.674418; --dn:0.651163;
    position:relative;overflow:hidden;isolation:isolate;   /* overflow:hidden で BFC 化し、章の余白が節の外へ抜けない */
    background:#6B1015;color:var(--cream);
    padding:0 var(--gx)}

  /* 地：専用アセット。減光もスクリムもかけない（アセット側で明度が確定している） */
  .cr::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:url("assets/std/page_beni_dark_1800.webp") center/cover}
  @media (min-width:1441px){
    .cr::before{background-image:url("assets/std/page_beni_dark_2400.webp")}
  }

  /* 柱（節のランニングヘッド）。箔はここだけ＝本文が載らない位置 */
  .cr__spine{position:absolute;left:clamp(6px,1.4vw,20px);top:clamp(40px,5vw,72px);
    writing-mode:vertical-rl;font-family:var(--fm);font-weight:400;
    font-size:16px;letter-spacing:.42em;color:var(--cream);
    display:flex;align-items:center;gap:14px}
  .cr__spine::after{content:"";width:1px;height:clamp(60px,9vh,120px);
    background:linear-gradient(180deg,var(--foil1),rgba(241,213,125,0))}

  .cr__in{position:relative;z-index:1;width:min(1288px,100%);margin:0 auto}

  /* 導入＝信条そのもの */
  .cr__lead{--lines:2;
    font-family:var(--fm);font-weight:400;font-size:var(--fl);
    line-height:1.9;letter-spacing:.08em;color:var(--cream);
    max-width:var(--col);margin-left:var(--ng);
    margin-top:calc(var(--lines) * 1.9em * var(--up));
    margin-bottom:calc(var(--lines) * 1.9em * var(--dn))}

  /* 章：1章＝1主張。左右交互。柱は列の外側の余白に置く（高さに効かない） */
  /* width:max-content ＝ 列を実際の行長まで縮める。760px固定のままだと右寄せ章で
     柱が本文から400px離れて漂う（実測1440で本文は255pxしか使わない） */
  .cr__ch{--lines:2;position:relative;font-size:var(--fs);
    width:max-content;max-width:min(var(--col),100%);margin-left:var(--ng);
    margin-top:calc(var(--lines) * 2em * var(--up));
    margin-bottom:calc(var(--lines) * 2em * var(--dn))}
  /* 左右交互は版面に余りがある幅でだけ。1200px未満だとずれが柱の幅程度で崩れて見える
     （実測: 768pxでは章二が章一より左に出た） */
  @media (min-width:1200px){
    .cr__ch--r{margin-left:auto;margin-right:var(--ng)}
  }

  .cr__no{position:absolute;top:.2em;right:100%;margin-right:calc(var(--ng) - 1.55em);
    writing-mode:vertical-rl;font-family:var(--fm);font-weight:400;
    font-size:1em;letter-spacing:.42em;color:var(--cream)}
  .cr__ch--r .cr__no{right:auto;left:100%;margin-right:0;margin-left:calc(var(--ng) - 1.55em)}

  .cr__body{font-family:var(--fm);font-weight:400;font-size:1em;
    line-height:2;letter-spacing:.085em;color:var(--cream)}

  .b-sp,.b-xs{display:none}

  /* 入場: 実測1〜2s（0.3s前後の短いフェードは高級側に実例なし） */
  .cr__rv{opacity:0;transform:translateY(24px);
    transition:opacity 1.6s cubic-bezier(.16,1,.3,1),transform 1.6s cubic-bezier(.16,1,.3,1)}
  .cr__rv.is-in{opacity:1;transform:none}
  .cr__rv:nth-of-type(2){transition-delay:.18s}
  .cr__rv:nth-of-type(3){transition-delay:.36s}
  .cr__rv:nth-of-type(4){transition-delay:.54s}
  @media (prefers-reduced-motion:reduce){
    .cr__rv{opacity:1!important;transform:none!important;transition:none!important}
  }

  @media (max-width:760px){
    .cr__spine{left:8px}
    .b-pc{display:none}
    .b-sp{display:inline}
    .cr__lead{--lines:5}
    .cr__ch--r{margin-left:var(--ng);margin-right:0}   /* SPは左右交互にしない */
    .cr__ch--r .cr__no{right:100%;left:auto;
      margin-right:calc(var(--ng) - 1.55em);margin-left:0}
    #ch1{--lines:4} #ch2{--lines:3} #ch3{--lines:4}
  }
  @media (max-width:360px){
    .b-xs{display:inline}
    #ch1{--lines:5} #ch3{--lines:5}
  }
</style>
</head>
<body>

<section class="cr" id="heart" aria-labelledby="crH">
  <p class="cr__spine" aria-hidden="true">信条</p>
  <div class="cr__in">

    <p class="cr__lead cr__rv" id="crH">やまと不動産の信条は<br class="b-sp">「この金額で、<br>ここまでできるんだ」と<br class="b-sp">驚いてもらえる<br class="b-sp">家づくりです。</p>

    <div class="cr__ch cr__rv" id="ch1">
      <p class="cr__no" aria-hidden="true">一</p>
      <p class="cr__body">「この予算では無理かも」と<br class="b-sp">思っていた人にこそ、<br>もっといい家が、その予算で<br class="b-sp">建つことを<br class="b-xs">知っていただきたいです。</p>
    </div>

    <div class="cr__ch cr__ch--r cr__rv" id="ch2">
      <p class="cr__no" aria-hidden="true">二</p>
      <p class="cr__body">毎日が楽しい暮らしを、<br class="b-sp">つくりたい。<br class="b-pc">そう考えて、<br class="b-sp">一軒ずつ設計しています。</p>
    </div>

    <div class="cr__ch cr__rv" id="ch3">
      <p class="cr__no" aria-hidden="true">三</p>
      <p class="cr__body">5年10年経っても<br class="b-sp">「やまと不動産にお願いして<br class="b-sp">良かった」と<br class="b-pc"><br class="b-xs">言ってもらえる家を、<br class="b-sp">私たちはつくっています。</p>
    </div>

  </div>
</section>

<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('.cr__rv'));
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('is-in')}); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('is-in'); io.unobserve(x.target); } });
  },{threshold:.2});
  els.forEach(function(e){ io.observe(e); });
})();
</script>
</body>
</html>
